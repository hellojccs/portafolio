<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dirty Dandy — Juan Carlos Carranza</title>
  <meta name="description" content="Dirty Dandy. Concepto de marca por Juan Carlos Carranza.">
  <link rel="canonical" href="https://hellojccs.com/proyecto-dirty-dandy.html">
  <meta property="og:url" content="https://hellojccs.com/proyecto-dirty-dandy.html">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/personaje-mini.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/Rinter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="am-page pj-page">
  <!-- Página de proyecto: se llega desde la tarjeta Dirty Dandy en Proyectos. -->
  <a href="index.html#proyectos" class="btn btn-lilac am-back"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg> Volver</a>

  <main class="pj">
    <header class="pj-head">
      <p class="label">// Proyecto</p>
      <h1>Dirty Dandy</h1>
      <p class="pj-tagline">Bar · Ciudad de México</p>
      <dl class="pj-meta">
        <div><dt>Año</dt><dd>2023</dd></div>
        <div><dt>Servicio</dt><dd>Concepto de marca</dd></div>
      </dl>
    </header>

    <div class="pj-video">
      <video src="assets/video/dirty-dandy.mp4" poster="assets/img/dirty-dandy/dd-poster.webp" autoplay muted loop playsinline preload="auto" aria-label="Video de Dirty Dandy"></video>
      <button type="button" class="pj-sound" aria-pressed="false" data-sound>Activar sonido</button>
    </div>

    <!-- Construcción de marca: cada capítulo es un paso. Para sumar piezas, copia una <figure>. -->
    <section class="dd-chapter">
      <div class="dd-step"><span>01</span><h2>Concepto &amp; tipografía</h2></div>
      <div class="dd-grid">
        <figure class="dd-item dd-full"><img src="assets/img/dirty-dandy/dd-09.webp" alt="Tarjetas tipográficas en francés: Je t'aime, mon amour" loading="lazy"></figure>
      </div>
    </section>

    <section class="dd-chapter">
      <div class="dd-step"><span>02</span><h2>Papelería &amp; menú</h2></div>
      <div class="dd-grid">
        <figure class="dd-item dd-full"><img src="assets/img/dirty-dandy/dd-08.webp" alt="Portada del menú de mixología: Je t'aime mon amour" loading="lazy"></figure>
        <figure class="dd-item dd-full"><img src="assets/img/dirty-dandy/dd-07.webp" alt="Menú Finger Food con arte abstracto" loading="lazy"></figure>
      </div>
    </section>

    <section class="dd-chapter">
      <div class="dd-step"><span>03</span><h2>Espacio</h2></div>
      <div class="dd-grid">
        <figure class="dd-item dd-full"><img src="assets/img/dirty-dandy/dd-03.webp" alt="Interior del bar con piso a rayas blanco y negro" loading="lazy"></figure>
        <figure class="dd-item dd-full"><img src="assets/img/dirty-dandy/dd-02.webp" alt="Barra con muro rojo, espejo redondo y árbol" loading="lazy"></figure>
      </div>
    </section>

    <section class="dd-chapter">
      <div class="dd-step"><span>04</span><h2>Experiencia</h2></div>
      <div class="dd-grid dd-three">
        <figure class="dd-item"><img src="assets/img/dirty-dandy/dd-05.webp" alt="Menú abierto en manos de una invitada" loading="lazy"></figure>
        <figure class="dd-item"><img src="assets/img/dirty-dandy/dd-04.webp" alt="Invitada con un martini en el bar" loading="lazy"></figure>
        <figure class="dd-item"><img src="assets/img/dirty-dandy/dd-01.webp" alt="DJ bajo el neón de Dirty Dandy" loading="lazy"></figure>
      </div>
      <div class="dd-grid">
        <figure class="dd-item dd-full"><img src="assets/img/dirty-dandy/dd-06.webp" alt="Fotografía en blanco y negro de una invitada con su coctel" loading="lazy"></figure>
      </div>
    </section>

    <div class="pj-cta">
      <a href="index.html#contacto" class="btn">Hablemos <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.5"/><path d="M7 12h10M12.5 7.5 17 12l-4.5 4.5"/></g></symbol>
  </svg>
  <script src="project-video.js" defer></script>
</body>
</html>
